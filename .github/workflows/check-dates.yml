name: Check for new ESI compatibility dates

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout latest .x branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all branches to determine next major version

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Detect new compatibility date
        id: detect
        run: |
          # Fetch latest date from ESI
          LATEST=$(curl -sf "https://esi.evetech.net/meta/compatibility-dates" \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['compatibility_dates']; print(sorted(d)[-1])")

          echo "latest_date=$LATEST" >> "$GITHUB_OUTPUT"

          # Check if we already track this date
          if grep -qx "$LATEST" compatibility-dates.txt 2>/dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "No new date (already tracking $LATEST)"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "New date found: $LATEST"
          fi

      - name: Determine next branch name
        if: steps.detect.outputs.is_new == 'true'
        id: branch
        run: |
          # Find the highest N from existing N.x remote branches
          LATEST_MAJOR=$(git branch -r | grep -oP '(?<=origin/)\d+(?=\.x$)' | sort -n | tail -1)
          NEXT_MAJOR=$((LATEST_MAJOR + 1))
          echo "next_major=$NEXT_MAJOR" >> "$GITHUB_OUTPUT"
          echo "branch_name=${NEXT_MAJOR}.x" >> "$GITHUB_OUTPUT"

      - name: Create branch, regenerate DTOs, open PR
        if: steps.detect.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_DATE: ${{ steps.detect.outputs.latest_date }}
          NEW_BRANCH: ${{ steps.branch.outputs.branch_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Base the new branch off the current default branch (highest N.x)
          BASE_BRANCH=$(git branch -r | grep -oP '(?<=origin/)\d+\.x$' | sort -V | tail -1)
          git checkout -b "$NEW_BRANCH" "origin/$BASE_BRANCH"

          # Regenerate all DTOs for the new compatibility date
          php bin/generate.php --compatibility-date="$NEW_DATE"

          # Update compatibility-dates.txt
          echo "$NEW_DATE" >> compatibility-dates.txt
          sort -u compatibility-dates.txt -o compatibility-dates.txt

          # Fix formatting
          vendor/bin/pint

          # Commit
          git add -A
          git commit -m "feat: regenerate DTOs for ESI compatibility date ${NEW_DATE}

          New ESI compatibility date detected. All 218+ response DTOs
          regenerated from the updated OpenAPI spec.

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin "$NEW_BRANCH"

          # Open PR
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$NEW_BRANCH" \
            --title "feat: ESI compatibility date ${NEW_DATE} (${NEW_BRANCH})" \
            --body "CCP published a new ESI compatibility date: \`${NEW_DATE}\`

          ## What changed

          All response DTOs have been regenerated from the updated OpenAPI spec. Review the diff to see which schemas changed.

          ## Checklist

          - [ ] Review changed DTOs for breaking changes (removed/renamed properties)
          - [ ] Update \`CHANGELOG.md\` if needed
          - [ ] Merge and tag \`${NEW_BRANCH:0:1}.0.0\` once satisfied

          ---
          *Opened automatically by the [check-dates workflow](../../actions/workflows/check-dates.yml).*"
