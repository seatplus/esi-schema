name: Check for new ESI compatibility dates

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout latest .x branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all branches to determine next major version

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Detect changes (new date OR spec content change)
        id: detect
        run: |
          # Fetch latest compatibility date
          LATEST=$(curl -sf "https://esi.evetech.net/meta/compatibility-dates" \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['compatibility_dates']; print(sorted(d)[-1])")

          echo "latest_date=$LATEST" >> "$GITHUB_OUTPUT"

          # Fetch current spec and compute its SHA256
          SPEC_URL="https://esi.evetech.net/latest/swagger.json"
          curl -sf "$SPEC_URL" -o /tmp/current-spec.json
          CURRENT_HASH=$(sha256sum /tmp/current-spec.json | awk '{print $1}')
          echo "spec_hash=$CURRENT_HASH" >> "$GITHUB_OUTPUT"

          # Compare: new compatibility date?
          DATE_IS_NEW=false
          if ! grep -qx "$LATEST" compatibility-dates.txt 2>/dev/null; then
            DATE_IS_NEW=true
            echo "New compatibility date found: $LATEST"
          fi

          # Compare: spec content changed since last generation?
          SPEC_IS_NEW=false
          STORED_HASH=$(cat .spec-hash 2>/dev/null || echo "")
          if [ "$CURRENT_HASH" != "$STORED_HASH" ]; then
            SPEC_IS_NEW=true
            echo "Spec content changed (hash: $CURRENT_HASH, stored: $STORED_HASH)"
          fi

          if [ "$DATE_IS_NEW" = "true" ] || [ "$SPEC_IS_NEW" = "true" ]; then
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "date_is_new=$DATE_IS_NEW" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected (date: $LATEST, hash: $CURRENT_HASH)"
          fi

      - name: Determine next branch name
        if: steps.detect.outputs.is_new == 'true'
        id: branch
        run: |
          LATEST_MAJOR=$(git branch -r | grep -oP '(?<=origin/)\d+(?=\.x$)' | sort -n | tail -1)

          if [ "${{ steps.detect.outputs.date_is_new }}" = "true" ]; then
            # New compatibility date → bump major (e.g. 1.x → 2.x)
            NEXT_MAJOR=$((LATEST_MAJOR + 1))
            echo "branch_name=${NEXT_MAJOR}.x" >> "$GITHUB_OUTPUT"
          else
            # Spec-only change → bump minor within same major (e.g. 1.x → 1.1, then 1.2, …)
            LATEST_MINOR=$(git branch -r \
              | grep -oP "(?<=origin/${LATEST_MAJOR}\.)\d+$" \
              | sort -n | tail -1)
            NEXT_MINOR=$(( ${LATEST_MINOR:-0} + 1 ))
            echo "branch_name=${LATEST_MAJOR}.${NEXT_MINOR}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch, regenerate DTOs+Resources, open PR
        if: steps.detect.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_DATE: ${{ steps.detect.outputs.latest_date }}
          NEW_BRANCH: ${{ steps.branch.outputs.branch_name }}
          SPEC_HASH: ${{ steps.detect.outputs.spec_hash }}
          DATE_IS_NEW: ${{ steps.detect.outputs.date_is_new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BASE_BRANCH=$(git branch -r | grep -oP '(?<=origin/)\d+\.x$' | sort -V | tail -1)
          git checkout -b "$NEW_BRANCH" "origin/$BASE_BRANCH"

          # Regenerate DTOs + Resources
          php bin/generate.php --compatibility-date="$NEW_DATE"

          # Update tracking files
          if [ "$DATE_IS_NEW" = "true" ]; then
            echo "$NEW_DATE" >> compatibility-dates.txt
            sort -u compatibility-dates.txt -o compatibility-dates.txt
          fi
          echo "$SPEC_HASH" > .spec-hash

          # Fix formatting
          vendor/bin/pint

          # Compose commit message
          if [ "$DATE_IS_NEW" = "true" ]; then
            TITLE="feat: regenerate DTOs+Resources for ESI compatibility date ${NEW_DATE}"
            CHANGE_REASON="New ESI compatibility date detected: \`${NEW_DATE}\`."
          else
            TITLE="fix: regenerate DTOs+Resources — ESI spec changed (${NEW_DATE})"
            CHANGE_REASON="ESI OpenAPI spec content changed without a new compatibility date (spec hash: \`${SPEC_HASH:0:12}\`)."
          fi

          git add -A
          git commit -m "${TITLE}

          ${CHANGE_REASON} All response DTOs and Resource classes regenerated
          from the updated OpenAPI spec.

          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin "$NEW_BRANCH"

          # PR body
          if [ "$DATE_IS_NEW" = "true" ]; then
            PR_BODY="CCP published a new ESI compatibility date: \`${NEW_DATE}\`

          ## What changed
          All response DTOs and Resource classes have been regenerated from the updated OpenAPI spec.
          Review the diff to see which schemas changed.

          ## Checklist
          - [ ] Review changed DTOs/Resources for breaking changes
          - [ ] Update \`CHANGELOG.md\` if needed
          - [ ] Merge and tag \`${NEW_BRANCH:0:1}.0.0\` once satisfied"
          else
            PR_BODY="The ESI OpenAPI spec changed **without** a new compatibility date.

          Spec hash: \`${SPEC_HASH:0:12}…\` (compatibility date remains \`${NEW_DATE}\`)

          ## What changed
          CCP silently updated one or more endpoint schemas. All response DTOs and Resource classes
          have been regenerated. Review the diff carefully — this may include undocumented field
          additions or type changes.

          ## Checklist
          - [ ] Review changed DTOs/Resources for undocumented breaking changes
          - [ ] Update \`CHANGELOG.md\` if needed
          - [ ] Merge once satisfied (no version bump required for additive-only changes)"
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$NEW_BRANCH" \
            --title "${TITLE}" \
            --body "${PR_BODY}

          ---
          *Opened automatically by the [check-dates workflow](../../actions/workflows/check-dates.yml).*"

