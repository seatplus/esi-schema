name: CI

on:
  push:
    branches: ["main"]
  # No branches filter: every PR must be tested regardless of its base, otherwise
  # branch protection's required context never reports and the PR is unmergeable.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # DO NOT RENAME. This exact string is main's required status check
    # (`required_status_checks.contexts`). Renaming it means the required context
    # never reports and every pull request hangs forever "waiting for status" —
    # which is half of why 55 bot PRs were unmergeable.
    name: PHP 8.3 — Tests + Static Analysis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify
        uses: ./.github/actions/verify
        with:
          php-version: "8.3"
