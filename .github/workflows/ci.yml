name: CI

on:
  push:
    branches: ["main"]
  # No branches filter: every PR must be tested regardless of its base, otherwise
  # branch protection's required context never reports and the PR is unmergeable.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # This exact string is main's required status check
    # (`required_status_checks.contexts`). If you change it, update branch
    # protection in the same change — a required context that never reports leaves
    # every pull request hanging forever "waiting for status", which is half of why
    # 55 bot PRs were unmergeable.
    #
    # Deliberately version-agnostic: it used to read "PHP 8.3 — Tests + Static
    # Analysis", which meant a routine PHP bump could not be done without breaking
    # branch protection. Keep the PHP version out of this string.
    name: Tests + Static Analysis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify
        uses: ./.github/actions/verify
        with:
          php-version: "8.5"
