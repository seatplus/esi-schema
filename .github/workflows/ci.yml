name: CI

on:
  push:
    branches: ["main"]
  # No branches filter: every PR must be tested regardless of its base, otherwise
  # branch protection's required context never reports and the PR is unmergeable.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP 8.3 — Tests + Static Analysis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: json
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Pint (style)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pest (unit tests)
        run: vendor/bin/pest --no-coverage

      - name: Pest (type coverage)
        run: vendor/bin/pest --type-coverage --min=100
