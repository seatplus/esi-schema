name: Verify
description: The single definition of "this tree is releasable"

# Used by ci.yml *and* by the release path, so "CI gates before the tag" is
# literal rather than aspirational: esi-sync runs this exact composite against the
# exact tree it is about to push and tag.
#
# Both extra gates are offline and deterministic. They do not touch ESI, so a
# release can never be blocked or corrupted by upstream availability.

inputs:
  php-version:
    description: PHP version to verify against
    default: "8.5"

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: json
        coverage: none
        tools: composer:v2

    - uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ inputs.php-version }}-composer-${{ hashFiles('composer.lock') }}
        restore-keys: ${{ runner.os }}-php${{ inputs.php-version }}-composer-

    - name: Install dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist

    # composer.json's `test` script is already the single definition of green:
    # pint --test, phpstan, pest, pest --type-coverage --min=100.
    - name: Lint, analyse, test
      shell: bash
      run: composer test

    # Proves src/ is exactly what the vendored spec produces. Catches a
    # hand-edited generated file, a stale manifest, and a spec swapped without
    # regenerating — none of which the test suite can see.
    #
    # The comparison is against a snapshot of the tree as handed to this action,
    # NOT `git diff` against HEAD. The invariant is a property of the tree under
    # test, and the two are not the same thing: esi-sync.yml runs this composite on
    # a tree it has just regenerated and has not committed yet, so a HEAD-relative
    # diff reports the sync's own — entirely correct — output as drift. That is not
    # a hypothetical; it failed every scheduled sync from 2026-08-05 onward, because
    # the diff is non-empty exactly when there is something to release.
    #
    # Snapshot-relative also strictly widens what is caught: `git diff` ignores
    # untracked files, so a generated file that the committed tree lacks was
    # previously invisible here. `diff -r` sees it.
    - name: Generated code is reproducible from the vendored spec
      shell: bash
      run: |
        set -euo pipefail
        snapshot="$(mktemp -d)"
        cp -a src "$snapshot/src"
        cp -a .esi/surface.json .esi/state.json "$snapshot/"

        # Read the date before regenerating; generate.php rewrites state.json.
        php bin/generate.php \
          --spec=.esi/openapi.yaml \
          --compatibility-date="$(jq -r .compatibility_date "$snapshot/state.json")"
        vendor/bin/pint --quiet

        drift=0
        diff -ru "$snapshot/src" src || drift=1
        diff -u "$snapshot/surface.json" .esi/surface.json || drift=1
        diff -u "$snapshot/state.json" .esi/state.json || drift=1
        if [ "$drift" -ne 0 ]; then
          echo "::error::src/ or .esi/ does not match .esi/openapi.yaml + bin/generate.php."
          echo "Either a generated file was hand-edited, or the committed state is stale."
          echo "Fix: php bin/generate.php --compatibility-date=<date> && vendor/bin/pint"
          exit 1
        fi

    - name: Vendored spec matches its recorded hash
      shell: bash
      run: |
        set -euo pipefail
        recorded="$(jq -r .spec_sha256 .esi/state.json)"
        actual="$(sha256sum .esi/openapi.yaml | cut -d' ' -f1)"
        if [ "$recorded" != "$actual" ]; then
          echo "::error::.esi/openapi.yaml sha256 is $actual but state.json records $recorded."
          exit 1
        fi
